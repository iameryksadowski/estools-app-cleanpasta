[workspace]
members = ["crates/cleanpasta-core", "crates/cleanpasta-platform", "crates/cleanpasta-cli", "app"]
default-members = ["crates/cleanpasta-core", "crates/cleanpasta-cli"]
resolver = "2"

[workspace.package]
version = "1.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
